services:
  satisfactory-server:
    container_name: 'satisfactory-server'
    hostname: 'satisfactory-server'
    image: 'robtme/satisfactory-server:latest'
    ports:
      - '7777:7777/tcp'
      - '7777:7777/udp'
      - '8888:8888/tcp'
    volumes:
      - satisfactory-data:/config
    environment:
      - MAXPLAYERS=4
      - PGID=1000
      - PUID=1000
      - STEAMBETA=false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  satisfactory-dashboard:
    container_name: 'satisfactory-dashboard'
    build:
      context: ./dashboard
    ports:
      - '3045:3045'
    # Share PID namespace with satisfactory-server to directly monitor game process memory (e.g. 981MB) and CPU.
    # This works out of the box in both Docker and Podman (rootless & rootful) without host socket permission issues.
    pid: 'service:satisfactory-server'
    volumes:
      # Read-only mount of the server config directory for log tailing and save game scanning
      - satisfactory-data:/config:ro
      # Persistent volume for 30-day metrics history
      - dashboard-data:/data
      # Optional container engine socket mount:
      # The dashboard automatically detects Docker or Podman sockets when mounted.
      # - Docker:
      #   - '/var/run/docker.sock:/var/run/docker.sock:ro'
      # - Rootless Podman (after running `systemctl --user enable --now podman.socket`):
      #   - '${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:ro'
    environment:
      - PORT=3045
      - SERVER_API_URL=https://satisfactory-server:7777
      - TARGET_CONTAINER=satisfactory-server
      - POLL_INTERVAL=5
      - SERVER_MEMORY_LIMIT_MB=8192
      # Optional: Provide an API token from `server.GenerateAPIToken` for authenticated server state
      # - API_TOKEN=
    depends_on:
      - satisfactory-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  satisfactory-data:
    name: satisfactory-data
  dashboard-data:
    name: satisfactory-dashboard-data